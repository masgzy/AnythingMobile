name: Release

# 推送 v* 标签时自动构建并发布 prerelease：APK 以单文件附件形式挂载（不打包 zip）。
# 使用正式签名（Secrets 证书）+ R8 收缩的 release 构建，参数与 ci.yml 保持一致
#（Go 1.27 / Gradle wrapper 9.7.1），产物统一重命名后上传。
# mapping.txt（R8 混淆映射）一并上传，用于还原崩溃堆栈。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Go 引擎测试（发布前把关）
        run: |
          cd core
          go vet ./...
          go test ./...

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Go 引擎 AAR（含 16KB 页对齐）
        run: |
          chmod +x build-aar.sh
          ./build-aar.sh

      # 自签证书由 repo Secrets 提供（与 ci.yml 同一套），保证各版本
      # 签名一致：可直接覆盖安装升级，无需先卸载。
      - name: 恢复签名证书（Secrets -> keystore.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/anything-release.jks
          # 用 echo 逐行生成而非 heredoc：heredoc 会继承 YAML 缩进，
          # 前导空格会被 java.util.Properties 当作续行处理
          {
            echo "storeFile=signing/anything-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties 已生成，证书指纹："
          keytool -list -v -keystore signing/anything-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep SHA256 || true

      - name: 生成 Gradle Wrapper 并构建 R8 收缩的签名 APK（多 ABI + universal）
        run: |
          gradle wrapper --gradle-version 9.7.1
          ./gradlew :app:assembleRelease --no-daemon

      # splits 全局生效：release 产出 4 个 APK（app-*-release.apk），
      # 需重命名为 AnythingMobile-<版本>-<abi>.apk 后再上传。
      - name: 产物清单（统一重命名为 AnythingMobile-<版本>-<abi>.apk）
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          OUT=app/build/outputs/apk/release
          mkdir -p "$OUT/renamed"
          for f in "$OUT"/*-release.apk; do
            case "$f" in
              *arm64-v8a*)   ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *x86_64*)      ABI=x86_64 ;;
              *)             ABI=universal ;;
            esac
            mv "$f" "$OUT/renamed/AnythingMobile-$VERSION-$ABI.apk"
          done
          ls -lh "$OUT/renamed"
          echo "APK_DIR=$OUT/renamed" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Releases（APK 单文件附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "AnythingMobile $TAG" --generate-notes --prerelease
          gh release upload "$TAG" "$APK_DIR"/*.apk

      # R8 混淆映射：崩溃堆栈还原用（retrace mapping.txt stacktrace）
      - name: 上传 mapping.txt（R8 混淆映射）
        if: hashFiles('app/build/outputs/mapping/release/mapping.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/mapping/release/mapping.txt
