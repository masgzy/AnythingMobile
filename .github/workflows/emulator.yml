name: Android Emulator

# 真实 Android 虚拟机上的回归网：JVM 单测（ci.yml）碰不到 JNI 加载、
# 系统服务与真实生命周期，这一层只能靠模拟器补齐。
#
# 流程：构建 Rust 引擎 .so -> debug APK -> GitHub 托管 runner（自带 KVM 嵌套
# 虚拟化）启动 API 31 x86_64 模拟器 -> 授权存储 -> 启动冒烟（进程存活
# + logcat 无崩溃指纹 + 截图）-> connectedDebugAndroidTest。
#
# 触发策略：仅当代码/构建脚本/workflow 本身变动才跑（改 README 不浪费
# 15 分钟模拟机时）；随时可 workflow_dispatch 手动点跑。
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "engine/**"
      - "gradle/wrapper/**"
      - "*.gradle.kts"
      - ".github/workflows/emulator.yml"
  pull_request:
  workflow_dispatch:

# 与 ci.yml 的 ci- 前缀分开：两个 workflow 并行互不取消
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # API 31 (Android 12) x86_64：minSdk 24 之上，启动速度与稳定性均衡；
  # MANAGE_EXTERNAL_STORAGE 的 appops 授权在该版本可用。
  # 未来需要多版本矩阵时，把这两个值换成 matrix 变量即可。
  SYS_IMAGE: system-images;android-31;google_apis;x86_64
  AVD_NAME: anything-ci
  PKG: com.masgzy.anything

jobs:
  emulator-smoke:
    name: 模拟器冒烟 + 仪器化测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 与 ci.yml 同款官方 action（均为 Node.js 24 原生运行时版本）
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 与 ci.yml 相同 key：两个 workflow 共享同一份 Gradle 缓存
      - name: Gradle 依赖缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 与 ci.yml 同款：wrapper jar 校验（审计 V-7）
      - name: Gradle Wrapper 校验
        uses: gradle/actions/wrapper-validation@v4

      # .so 直接输出到 app/src/main/jniLibs/<abi>/（AGP 自动打包进 debug APK）
      - name: 构建 Rust 引擎 .so（cargo-ndk 三 ABI + 16KB 对齐校验）
        run: |
          chmod +x engine/build-so.sh
          ./engine/build-so.sh

      # debug 变体：R8 关闭、自动 debug 签名，不需要任何 Secrets；
      # release 变体（standard universal）：R8 + 正式签名 —— 图标渲染回归
      # （alpha28：material3 被静默仲裁到 1.5.0-alpha22，release R8 下图标全空白）
      # 是 release-only 问题，debug 包永远看不出来 —— 冒烟必须装 release 包。
      - name: 构建 debug APK
        run: ./gradlew :app:assembleStandardDebug --no-daemon

      - name: 恢复签名证书（Secrets -> keystore.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/anything-release.jks
          {
            echo "storeFile=signing/anything-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties 已生成"

      - name: 构建 standard release universal APK
        run: ./gradlew :app:assembleStandardRelease --no-daemon

      # ---------- Android 虚拟机 ----------

      # 2026 年 runner 镜像不再预装 emulator 组件（首跑实证：
      # $ANDROID_HOME/emulator/emulator 不存在导致 exit 127），
      # 需与系统镜像一起现装；cmdline-tools 的目录号不定，
      # 兼容 latest 与版本号目录两种布局。
      - name: 安装 emulator 组件与系统镜像
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "emulator" "$SYS_IMAGE" > /dev/null
          echo "emulator 与系统镜像安装完成"

      # GitHub 托管 runner 自带嵌套虚拟化：/dev/kvm（root:kvm 组）。
      # 注意：新版 emulator（37.x）已移除 -accel check（首跑实证：参数被
      # 吞掉后按"无 AVD 启动"报错退出），改为验证设备节点可写；
      # 加速的硬性兜底在启动参数 -accel on（KVM 不可用会直接报错）。
      - name: KVM 可用性检查
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm && echo "KVM 就绪（/dev/kvm 可写）"

      - name: 创建 AVD
        run: |
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDM" ] || AVDM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/avdmanager | head -1)
          # echo "no"：跳过自定义硬件配置向导交互
          echo "no" | "$AVDM" create avd -n "$AVD_NAME" -k "$SYS_IMAGE"
          # 三跑实证：新版 avdmanager 走 XDG 目录（~/.config/.android/avd），
          # 而模拟器只认 $ANDROID_AVD_HOME、$ANDROID_SDK_HOME/avd、
          # $HOME/.android/avd 三处 —— 按实际落点导出 ANDROID_AVD_HOME
          AVD_INI=$(find "$HOME" -name "$AVD_NAME.ini" 2>/dev/null | head -1)
          [ -n "$AVD_INI" ] || { echo "未找到 AVD ini 文件"; exit 1; }
          echo "AVD ini: $AVD_INI"
          echo "ANDROID_AVD_HOME=$(dirname "$AVD_INI")" >> "$GITHUB_ENV"

      # 后台进程在同 job 的后续 step 中存活；日志落 /tmp 备排障
      - name: 启动模拟器并等待开机完成
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          export EMU_PID
          echo "模拟器后台启动中（PID $EMU_PID），日志 /tmp/emulator.log"
          # 轮询 sys.boot_completed；进程退出则立即打日志失败 ——
          # 不能只用 wait-for-device：模拟器秒退时它会干等满 7 分钟（三跑实证）
          timeout 420 bash -c '
            while true; do
              kill -0 "$EMU_PID" 2>/dev/null || { echo "模拟器进程提前退出，日志："; cat /tmp/emulator.log; exit 1; }
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] && exit 0
              sleep 3
            done
          '
          echo "开机完成：Android $(adb shell getprop ro.build.version.release | tr -d '\r')"

      # 首启会进欢迎页引导授权，提前授掉，冒烟直达主界面
      - name: 预授权存储权限
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb shell pm grant "$PKG" android.permission.READ_EXTERNAL_STORAGE || true
          # Android 11+ 全盘访问走 appops（部分版本需要 --uid 形式，两条都发）
          adb shell appops set "$PKG" MANAGE_EXTERNAL_STORAGE allow || true
          adb shell appops set --uid "$PKG" MANAGE_EXTERNAL_STORAGE allow || true

      - name: 冒烟：安装 release APK 并启动主界面
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # 装 standard release universal 整包：R8 + 正式签名，与用户侧载同款
          # （release-only 回归如 alpha28 图标空白只有这个包能暴露）
          APK=$(ls app/build/outputs/apk/standard/release/*universal*.apk | head -1)
          echo "安装 $APK"
          adb install -r -t "$APK"
          adb logcat -c
          adb shell am start -W -n "$PKG/.MainActivity" | tee /tmp/am-start.txt
          grep -q "Status: ok" /tmp/am-start.txt || { echo "am start 启动失败"; exit 1; }
          # 等 Compose 首帧 + 引擎初始化
          sleep 10
          PID=$(adb shell pidof "$PKG" | tr -d '\r')
          [ -n "$PID" ] || { echo "进程 10 秒内消失 —— 启动即崩"; exit 1; }
          echo "主进程存活：PID $PID"
          # 首启停在欢迎页（引导 3 页）：左下角「跳过」直达主界面。
          # 按屏幕比例定位（按钮中心约在 16% / 93%），适配任意分辨率。
          SIZE=$(adb shell wm size | grep -o '[0-9]*x[0-9]*' | head -1)
          W=${SIZE%x*}; H=${SIZE#*x}
          echo "屏幕 ${W}x${H}，点「跳过」进主界面"
          adb shell input tap $((W*16/100)) $((H*93/100))
          sleep 4
          # 崩溃指纹：AndroidRuntime 块里的 Process 行必然带包名
          if adb logcat -d | grep -q "E AndroidRuntime.*$PKG"; then
            echo "logcat 检出本应用 FATAL EXCEPTION"; exit 1
          fi
          adb exec-out screencap -p > anything-emulator-home.png
          ls -lh anything-emulator-home.png
          # 切到设置 tab（底栏第三项，中心约 83% / 93%）：验证 MD3 还原
          # 观感（12dp 分组卡 + 标准分割线 + 裸主色图标）
          adb shell input tap $((W*83/100)) $((H*93/100))
          sleep 4
          adb exec-out screencap -p > anything-emulator-settings.png
          ls -lh anything-emulator-settings.png
          # 卸干净冒烟安装：UTP 重装时避免与 adb 直装包做签名比对
          # （INSTALL_FAILED_UPDATE_INCOMPATIBLE，四跑实证），让 UTP 全新装
          adb uninstall "$PKG" || true
          adb uninstall "$PKG.test" || true

      # ActivityScenario 启动链路回归（app/src/androidTest/AppLaunchTest.kt）
      # alpha26 flavor 化后任务名带渠道：connected<Channel>DebugAndroidTest
      # （审计 E-2：旧名 connectedDebugAndroidTest 不存在，任务解析阶段即失败）
      - name: 仪器化测试（connectedStandardDebugAndroidTest）
        run: ./gradlew :app:connectedStandardDebugAndroidTest --no-daemon

      # ---------- 产物 ----------

      - name: 上传模拟器截图（直传）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            anything-emulator-home.png
            anything-emulator-settings.png

      - name: 失败时收集现场
        if: failure()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # 新版 adb logcat 在无设备时会挂起等设备（首跑实证：
          # "- waiting for device -" 吊死 10 分钟直到手动取消），必须上 timeout
          timeout 30 adb logcat -d > anything-logcat.txt || true
          cp /tmp/emulator.log . || true
          cp /tmp/am-start.txt . || true
          exit 0

      - name: 上传失败现场（logcat + 模拟器日志 + 测试报告）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: |
            anything-logcat.txt
            emulator.log
            am-start.txt
            app/build/outputs/androidTest-results/
