name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新推送自动取消未完成的旧任务，节省构建资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Rust 引擎测试 + 多ABI 签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 官方 action 均为 Node.js 24 原生运行时版本，
      # 消除 "Node.js 20 is deprecated" 警告：
      #   checkout v7 / cache v6 / setup-java v6 / upload-artifact v7
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链（stable + Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy, rustfmt

      # 缓存 engine 的 registry/git/target，无 Cargo.lock 变更时秒级恢复
      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Rust 引擎测试（fmt + clippy 严格 + test）
        run: |
          cd engine
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # .so 直接输出到 app/src/main/jniLibs/<abi>/（AGP 自动打包进 APK）
      - name: 构建 Rust 引擎 .so（cargo-ndk 三 ABI + 16KB 对齐校验）
        run: |
          chmod +x engine/build-so.sh
          ./engine/build-so.sh

      # 自签证书由 repo Secrets 提供（KEYSTORE_BASE64/KEYSTORE_PASSWORD/
      # KEY_ALIAS/KEY_PASSWORD），解码后生成 keystore.properties 供
      # app/build.gradle.kts 读取并给 release APK 签名。
      - name: 恢复签名证书（Secrets -> keystore.properties）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/anything-release.jks
          # 用 echo 逐行生成而非 heredoc：heredoc 会继承 YAML 缩进，
          # 前导空格会被 java.util.Properties 当作续行处理
          {
            echo "storeFile=signing/anything-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties 已生成，证书指纹："
          keytool -list -v -keystore signing/anything-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep SHA256 || true

      # Gradle Wrapper 已随仓库分发（gradlew + gradle/wrapper/*），
      # 任何环境构建的 Gradle 版本恒为 wrapper.properties 锁定的 9.7.1，可复现
      - name: Gradle 依赖缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Kotlin 单元测试（旧格式解析回归网，debug 变体 —— AGP 9 无 release 单测任务）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # 双渠道（alpha26）：standard + offline 两条 R8 流水线，与 release.yml 同构
      - name: 构建双渠道签名 APK（standard + offline，各多 ABI + universal）
        run: ./gradlew :app:assembleStandardRelease :app:assembleOfflineRelease --no-daemon

      # 重命名规则（offline 包加 _offline 后缀，与 release.yml 一致）：
      #   standard → AnythingMobile-<版本>-<abi>.apk
      #   offline  → AnythingMobile-<版本>-<abi>_offline.apk
      - name: 产物清单（统一重命名，offline 包加 _offline 后缀）
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          OUT=app/build/outputs/apk/release
          mkdir -p "$OUT/renamed"
          for f in "$OUT"/*.apk; do
            case "$f" in
              *arm64-v8a*)   ABI=arm64-v8a ;;
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *x86_64*)      ABI=x86_64 ;;
              *)             ABI=universal ;;
            esac
            case "$f" in
              *offline*) SUFFIX="_offline" ;;
              *)         SUFFIX="" ;;
            esac
            mv "$f" "$OUT/renamed/AnythingMobile-$VERSION-$ABI$SUFFIX.apk"
          done
          ls -lh "$OUT/renamed"

      # upload-artifact v7 新能力：单文件直传（archive: false）。
      # 不打 zip 包，artifact 名 = 文件名，下载即得可安装的 APK 本体。
      # 注意：该模式要求 path 只能解析到一个文件，因此按 ABI 分步上传。
      - name: 上传 arm64-v8a APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-arm64-v8a.apk

      - name: 上传 armeabi-v7a APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-armeabi-v7a.apk

      - name: 上传 x86_64 APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-x86_64.apk

      - name: 上传 universal APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-universal.apk

      # offline 渠道四件套（文件名带 _offline 后缀，与 standard 通配符互斥）
      - name: 上传 arm64-v8a 离线版 APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-arm64-v8a_offline.apk

      - name: 上传 armeabi-v7a 离线版 APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-armeabi-v7a_offline.apk

      - name: 上传 x86_64 离线版 APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-x86_64_offline.apk

      - name: 上传 universal 离线版 APK（直传）
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/release/renamed/AnythingMobile-*-universal_offline.apk


