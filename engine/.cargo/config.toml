# Anything 引擎构建配置（对齐 CFSTMobile engine/.cargo/config.toml 方案）
# Android 目标：统一 16KB 页对齐（Android 15+ 16KB 页设备加载要求）
# 参考: developer.android.com/guide/practices/page-sizes

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[build]
# 桌面 dev 构建：保持默认溢出检查（解析不可信输入的代码里整数溢出在
# 开发期就 panic 暴露，审计 §4.3）。release 由下方 [profile.release]
# 统一关闭溢出检查，不在此处全局 off —— 那会让 dev 构建也静默回绕。

[profile.release]
# panic 策略保持默认 unwind：FFI 边界用 catch_unwind 拦截 panic，
# 若改成 abort，任何内部 panic 都会直接杀死宿主 App 进程。
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
incremental = false
overflow-checks = false
